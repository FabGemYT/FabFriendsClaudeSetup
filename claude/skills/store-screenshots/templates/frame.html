<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Local faces, fetched by scripts/fetch-fonts.mjs. Never link a font CDN
     here: one 404 on one subset and the frame ships in Times with nothing in
     the output saying so. -->
<link rel="stylesheet" href="../fonts/faces.css">
<link rel="stylesheet" href="frame.css">
<title>frame template</title>
<style>
  /* Frame-specific bits go here. Anything reusable belongs in frame.css. */
</style>
</head>
<body>
<div class="frame">
  <!-- Background art only. Generated by scripts/art.mjs, fitted by fit.py.
       The model never draws type, devices or UI. -->
  <img class="bg" src="../art/frame-bg.jpg" alt="">
  <div class="scrim"></div>
  <div class="coolrim"></div>
  <div class="crown"></div>

  <div class="stack">
    <!-- ONE promise. Two lines. The second gets the accent and the emphasis
         word. Size is set by fit.js — do not hardcode it. -->
    <h1 class="headline">
      <span class="l1">First line here</span><br>
      <span class="gold">Second line here.</span>
    </h1>

    <!-- A second, smaller claim. Not a label. -->
    <div class="eyebrow"><i class="l"></i>The smaller claim<i class="r"></i></div>

    <!--
      THE TEACHING DEVICE goes here — the part most listings are missing.
      A funnel, a named distance, a cast of three, a before/after pair, a tick
      list. See references/playbook.md for which to reach for.
    -->
    <div class="card lit" style="margin-top:52px">
      <div class="label">Label</div>
      <div class="body">The thing the phone below is about to show.</div>
    </div>

    <div class="flow">
      <svg width="88" height="50" viewBox="0 0 88 50" fill="none">
        <path d="M9 14 L44 39 L79 14" stroke="currentColor" stroke-width="9"
              stroke-linecap="round" stroke-linejoin="round" style="color:var(--accent)"/>
      </svg>
    </div>
  </div>

  <!-- The device. data-gap is the space between the last stack element and the
       top of the phone; fit.js seats it. Let it bleed off the bottom edge. -->
  <div class="phoneWrap" id="phoneWrap" data-gap="80">
    <div class="floorglow"></div>
    <div class="phone"><div class="screen"><div class="island"></div>
      <div class="app">

        <div class="statusbar">
          <span>9:41</span>
          <span class="right">
            <svg width="18" height="12" viewBox="0 0 17 11" fill="#fff"><rect y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" width="3" height="11" rx="1"/></svg>
            <svg width="17" height="12" viewBox="0 0 16 12" fill="#fff"><path d="M8 10.2a1.4 1.4 0 100-2.8 1.4 1.4 0 000 2.8zM4.6 6.9a4.8 4.8 0 016.8 0l1.2-1.3a6.6 6.6 0 00-9.2 0l1.2 1.3zM1.9 4.2a8.6 8.6 0 0112.2 0l1.2-1.3a10.4 10.4 0 00-14.6 0l1.2 1.3z"/></svg>
            <svg width="26" height="13" viewBox="0 0 25 12" fill="none"><rect x=".5" y=".5" width="21" height="11" rx="3.2" stroke="#fff" stroke-opacity=".5"/><rect x="2" y="2" width="16.5" height="8" rx="2" fill="#fff"/><path d="M23 4.2v3.6c.9-.3 1.4-.9 1.4-1.8s-.5-1.5-1.4-1.8z" fill="#fff" fill-opacity=".5"/></svg>
          </span>
        </div>

        <!-- The app's real screen, rebuilt from ITS OWN CSS tokens. Fill it:
             a rebuilt screen that runs out of copy shows a slab of flat
             background above the frame edge and reads as a rendering bug.
             render.mjs measures that gap and flags anything over 150px. -->
        <div class="scroller">
          <!-- app content -->
        </div>

      </div>
    </div></div>
  </div>
</div>

<script>
  // Declare every face this frame renders. fit.js loads them BEFORE measuring,
  // because document.fonts.ready lies when nothing is using them yet.
  window.__fonts = [
    '400 120px "YourDisplayFace"',
    '400 42px "YourReadingFace"',
    '600 27px "Inter"',
  ];
</script>
<script src="fit.js"></script>
</body>
</html>
